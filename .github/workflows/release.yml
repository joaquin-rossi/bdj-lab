name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p bd-build
      - run: cp target/release/bd-build bd-build-linux-x86_64
      - run: gh release create "$GITHUB_REF_NAME" bd-build-linux-x86_64 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
